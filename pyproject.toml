[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-generator"
version = "0.1.0"
description = "US equity alpha research system: registry, data adapter, expression engine."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.1",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14",
    "numba>=0.59",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
]

[tool.setuptools.packages.find]
include = ["alpha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "benchmark: performance assertions; may be slow on cold numba caches",
    "slow: excluded from the default fast loop",
]

[tool.ruff]
line-length = 100
target-version = "py311"
